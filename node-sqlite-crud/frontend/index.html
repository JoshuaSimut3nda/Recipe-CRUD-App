<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe CRUD App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        form { background: #f9f9f9; padding: 15px; border-radius: 5px; max-width: 400px; }
        input, textarea { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
    </style>
</head>
<body>
    <h1>Recipe Manager</h1>

    <form id="recipeForm">
        <input type="hidden" id="recipeId">
        <label>Title:</label>
        <input type="text" id="title" required>
        <label>Ingredients:</label>
        <input type="text" id="ingredients">
        <label>Instructions:</label>
        <textarea id="instructions"></textarea>
        <label>Prep Time (mins):</label>
        <input type="number" id="prep_time_mins">
        <label>Category:</label>
        <input type="text" id="category">
        <button type="submit" id="saveBtn">Save Recipe</button>
    </form>

    <h2>Existing Recipes</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Prep Time</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="recipeTableBody"></tbody>
    </table>

    <script src="app.js?v=2"></script>
</body>
</html>
